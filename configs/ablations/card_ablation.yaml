seed: 0
gpu_index: 1
num_candidates: 10
humanmac_multimodal_threshold: 7.0

preprocessing:
  input_n: 70
  output_n: 30
  stride: 5
  time_interp: null
  window_norm: null
  eval_batch_mult: 1

datasets: [assembly]
action_filter: ["pick_up_screwd"]

runtime:
  output_root: ./results
  aggregate_csv: ./results/card_ablations.csv

data_roots:
  assembly: /mnt/pve/Turing-Storage2/AssemblyHands/assembly101-download-scripts/data_our/

card_ablation_base: &card_ablation_base
  config_path: ../models/card.yaml
  base_model: card
  enabled: true
  options:
    save_eval_samples: true
  defaults:
    save_eval_examples: true

