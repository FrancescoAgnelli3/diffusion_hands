seeds: [0, 1, 2]
# Keep source-file selection and official train/validation/test membership fixed
# while changing the training RNG across seeds.
data_seed: 0
card_k_low_reserve: 10
gpu_index: 1
num_candidates: 10
humanmac_multimodal_threshold: auto
# The historical radius is a scaled training median. If it yields no eligible
# held-out neighbours, preflight expands it by 10% until MMADE/MMFDE are defined.
humanmac_multimodal_calibration:
  k: 1
  neighbour_retry_scale: 1.1
  max_neighbour_retry_steps: 100
  max_samples: 4096
  max_test_samples: 0
  chunk_size: 128
save_model: true

# Shared preprocessing/data window choices.
# These values are now enforced across all models by run_all_models.py.
preprocessing:
  input_n: 50
  output_n: 50
  stride: 20
  time_interp: null
  window_norm: null
  eval_batch_mult: 1

# Use one dataset via `dataset`, or multiple datasets via `datasets`.
# When `datasets` is set, each dataset is processed sequentially:
# load data -> train/eval all enabled models -> next dataset.
# datasets: [bighands, h2o]
# datasets: [bighands]
datasets: [assembly, bighands, h2o, fpha]
# Use one action as a string, or multiple assembly actions as a list.
# If empty, defaults to pick_up_screwd only for assembly.
# action_filter: ["pick_up_screwd"]
action_filter: ["remove", "rotate", "unscrew", "pick", "put", "attempt"]

models:
  card:
    enabled: false
  star_hand:
    enabled: false
  fihard:
    enabled: true
  belfusion:
    enabled: false
  comusion:
    enabled: true
  dlow_cvae:
    enabled: true
  humanmac:
    enabled: true
  skeletondiffusion:
    enabled: false
  gsps:
    enabled: true
  simlpe:
    enabled: true
    base_model: simlpe_dct
  cacheflow:
    enabled: true
  stars:
    enabled: true
  hybrid_cvae:
    enabled: false
  cit_grip_phase_coupled_soft:
    enabled: true
    config_path: models/cit.yaml
    base_model: cit
    defaults:
      proposal_options:
        main_grip_model: true
    notes: Half-strength grip phase warp with fixed frame-aligned kinematic clock conditioning

