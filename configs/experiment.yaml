seeds: [0, 1, 2]
# Keep source-file selection and official train/validation/test membership fixed
# while changing the training RNG across seeds.
data_seed: 0
card_k_low_reserve: 10
gpu_index: 1
num_candidates: 10
humanmac_multimodal_threshold: auto
save_model: true

# Shared preprocessing/data window choices.
# These values are now enforced across all models by run_all_models.py.
preprocessing:
  input_n: 50
  output_n: 50
  stride: 20
  time_interp: null
  window_norm: null
  eval_batch_mult: 1

# Use one dataset via `dataset`, or multiple datasets via `datasets`.
# When `datasets` is set, each dataset is processed sequentially:
# load data -> train/eval all enabled models -> next dataset.
# datasets: [bighands, h2o]
# datasets: [bighands]
datasets: [assembly, bighands, h2o, fpha]
# Use one action as a string, or multiple assembly actions as a list.
# If empty, defaults to pick_up_screwd only for assembly.
# action_filter: ["pick_up_screwd"]
action_filter: ["remove", "rotate", "unscrew", "pick", "put", "attempt"]

models:
  card:
    enabled: false
  star_hand:
    enabled: false
  fihard:
    enabled: true
  belfusion:
    enabled: true
  comusion:
    enabled: true
  dlow_cvae:
    enabled: true
  humanmac:
    enabled: true
  skeletondiffusion:
    enabled: true
  gsps:
    enabled: true
  cit_linear:
    config_path: models/cit.yaml
    base_model: cit
    defaults:
      proposal_options:
        propagation: linear
        max_persistence: 0.98
        scale_floor: 0.0001
        terminal_kinematic_projection: false
        grip_phase_transport: false
    notes: CIT linear causal-innovation transport baseline
  cit_grip_phase_soft:
    config_path: models/cit.yaml
    base_model: cit
    defaults:
      proposal_options:
        propagation: linear
        max_persistence: 0.98
        scale_floor: 0.0001
        terminal_kinematic_projection: true
        grip_phase_transport: true
        grip_clock_hidden_dim: 128
        grip_clock_loss_weight: 0.1
        grip_phase_strength: 0.5
        grip_clock_conditioning: false
    notes: Half-strength grip phase warp
  cit_grip_phase_coupled:
    config_path: models/cit.yaml
    base_model: cit
    defaults:
      proposal_options:
        propagation: linear
        max_persistence: 0.98
        scale_floor: 0.0001
        terminal_kinematic_projection: true
        grip_phase_transport: true
        grip_clock_hidden_dim: 128
        grip_clock_loss_weight: 0.1
        grip_phase_strength: 1.0
        grip_clock_conditioning: true
    notes: Full grip phase warp with clock conditioning
  cit_grip_phase_coupled_soft:
    config_path: models/cit.yaml
    base_model: cit
    defaults:
      proposal_options:
        propagation: linear
        max_persistence: 0.98
        scale_floor: 0.0001
        terminal_kinematic_projection: true
        grip_phase_transport: true
        grip_clock_hidden_dim: 128
        grip_clock_loss_weight: 0.1
        grip_phase_strength: 0.5
        grip_clock_conditioning: true
    notes: Half-strength grip phase warp with clock conditioning

runtime:
  output_root: ./results
  aggregate_csv: ./results/all_models_three_seeds_long.csv
  summary_csv: ./results/all_models_three_seeds_mean_std.csv
  per_action_csv: ./results/all_models_three_seeds_by_action.csv
