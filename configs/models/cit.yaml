# Use the audited research config for controlled comparisons.
model: cit
enabled: true
save_eval_samples: true
train:
  epochs: 100
  early_stopping:
    enabled: false
    patience: 15
    min_delta: 0.0001
    warmup: 15
    monitor: train_loss
defaults:
  batch_size: 256
  lr: 0.001
  hidden_size: 128
  gru_layers: 8
  gradient_clip: 0
  bone_loss_weight: 0.0
  simlpe_norm_axis: all
  simlpe_use_norm: true
  simlpe_use_spatial_fc_only: false
  simlpe_mix_spatial_temporal: false
  simlpe_add_last_offset: true
  card_k_low: 80
  card_diffusion_epochs: 200
  card_diffusion_steps: 50
  card_ddim_steps: 25
  card_isotropic_noise: false
  card_spatial_anisotropy: true
  card_beta_matrix_power: 1.0
  card_beta_matrix_min_rate: 0.0
  card_beta_matrix_max_rate: 10
  card_temporal_anisotropy: false
  card_temporal_anisotropy_q: 1.0
  card_temporal_operator_type: identity
  card_temporal_operator_spectral_transform: identity_shifted_power
  card_temporal_velocity_weight: 1.0
  card_temporal_acceleration_weight: 0
  card_temporal_jerk_weight: 0
  card_temporal_anisotropy_learned_from_history: false
  card_temporal_anisotropy_history_dim: 128
  card_temporal_anisotropy_delta_max_abs: 2.0
  card_node_covariance_type: laplacian_heat_kernel
  card_mobility_palm_var: 0.15
  card_mobility_depth1_var: 0.35
  card_mobility_depth2_var: 0.7
  card_mobility_depth3plus_var: 1.0
  card_dhalf_init_mode: fixed
  card_dhalf_data_scale: max
  card_dhalf_gamma: 1
  card_learnable_dhalf: false
  card_graph_laplacian_alpha: 0.0
  card_graph_laplacian_beta: 1.0
  card_denoiser_dim: 256
  card_denoiser_depth: 6
  card_denoiser_heads: 4
  card_dropout: 0.0
  card_freeze_coarse: true
  card_diffusion_coarse_warmup_epochs: 0
  card_allow_no_conditioning: false
  card_diffusion_only: false
  card_cond_use_history: true
  card_cond_use_coarse: true
  card_use_mamp_condition: false
  card_use_mamp_condition_coarse: false
  card_mpjpe_weight: 0.0
  card_coarse_target_lowpass_only: false
  card_use_latent_variability: false
  card_latent_dim: 8
  card_beta_kl: 0.001
  card_kl_anneal_steps: 0
  card_latent_encoder_hidden_dim: 256
  card_latent_conditioning_mode: add
  card_num_actions: 1
  card_latent_baseline_pretrain_epochs: 0
  card_latent_warmup_epochs: 0
  card_latent_joint_lr_scale: 0.1
  card_explainable_latent_decomposition: false
  card_latent_action_dim: 4
  card_latent_style_dim: 4
  card_latent_residual_dim: 4
  card_beta_action: 0.1
  card_beta_adversarial: 0.1
  card_grl_anneal_steps: 10000
  use_lr_scheduler: false
  proposal_options:
    propagation: linear
    max_persistence: 0.98
    scale_floor: 0.0001
