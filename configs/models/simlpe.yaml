model: simlpe_dct
enabled: true
save_eval_samples: false
train:
  epochs: 100
  early_stopping:
    enabled: true
    patience: 15
    min_delta: 0.0001
    warmup: 15
    monitor: train_loss
defaults:
  batch_size: 256
  lr: 0.001
  hidden_size: 128
  gru_layers: 8
  gradient_clip: 10.0
  bone_loss_weight: 0.0
  simlpe_norm_axis: all
  simlpe_use_norm: true
  simlpe_use_spatial_fc_only: false
  simlpe_mix_spatial_temporal: false
  simlpe_add_last_offset: true
