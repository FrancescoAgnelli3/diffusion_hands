# Evaluation-only DLow configuration for the E1 Assembly ``remove`` cohort.
# The model was trained with the same architecture/hyperparameters; only the
# history and prediction lengths identify the E1 protocol.
dataset: assembly
action_filter: remove
seed: 0
data_seed: 0
stride: 20
time_interp: null
normalize_data: false
nz: 128
t_his: 30
t_pred: 10
lambda_v: 1000
beta: 0.1
vae_specs:
  rnn_type: gru
  x_birnn: false
  e_birnn: false
  use_drnn_mlp: true
vae_lr: 0.001
batch_size: 64
num_vae_epoch: 500
num_vae_epoch_fix: 100
num_vae_data_sample: 5000
nk: 10
dlow_batch_size: 64
d_scale: 100
lambda_j: 1
lambda_kl: 1
lambda_recon: 2.0
dlow_lr: 0.0001
dlow_specs:
  model_name: NFDiag
  rnn_type: gru
  nh_mlp: [1024, 512]
  x_birnn: false
num_dlow_epoch: 500
num_dlow_epoch_fix: 100
num_dlow_data_sample: 5000
